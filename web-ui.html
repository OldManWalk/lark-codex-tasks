<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LarkNotify 管理后台</title>
<style>
:root{color-scheme:light;--ink:#26354a;--muted:#66778d;--bg:#f3f6fa;--line:#dce3ed;--blue:#2357c4;--green:#157657;--red:#b83a43;--amber:#95610d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:7px 13px;background:white;color:var(--ink);white-space:nowrap}button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:var(--red)}:focus-visible{outline:3px solid #8baef4;outline-offset:3px}input,select{padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink)}input[type=search]{width:280px;max-width:100%}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.5px}h2{font-size:17px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.app{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{background:#e9eef6;border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:750;padding:0 14px}.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}.sidebar nav{margin-top:36px;display:grid;gap:6px}.nav{border:0;background:transparent;text-align:left;padding:11px 14px;font-weight:550}.nav.active{background:white;color:var(--blue);box-shadow:0 1px 3px #233b6810}.sidefoot{margin-top:auto;padding:14px;color:var(--muted);font-size:12px}.sidefoot button{display:block;margin-top:12px}main{padding:34px 40px;max-width:1600px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.top p{margin-top:6px}.connection{text-align:right;font-size:12px;color:var(--muted)}.connection strong{display:block;font-size:14px;color:var(--green)}.banner{padding:12px 16px;border-left:4px solid var(--amber);background:#fff6df;margin:12px 0;color:#704f18}.banner.error{border-color:var(--red);background:#fff0f1;color:#8d2934}.banner.info{background:#eaf1ff;border-color:var(--blue);color:#294d8d}.surface{background:white;border:1px solid var(--line);border-radius:10px;margin:20px 0;overflow:hidden}.surface header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}.pad{padding:22px}.service{display:flex;gap:28px;justify-content:space-between;align-items:center}.service h2{font-size:22px;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:24px;padding-top:20px;gap:16px}.metrics strong{font-size:25px;display:block;font-weight:650}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#edf1f6;color:var(--muted)}.badge.good{background:#e4f4ed;color:var(--green)}.badge.bad{background:#fdecef;color:var(--red)}.badge.warn{background:#fff2d4;color:var(--amber)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:20px 0}.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-weight:550;background:#f8fafd;color:var(--muted);padding:12px 20px;white-space:nowrap}td{padding:15px 20px;border-top:1px solid #edf0f5;vertical-align:top}td.title{min-width:220px;max-width:460px;word-break:break-word}td.actions-cell{min-width:160px}td.actions-cell button{padding:4px 10px;margin:2px;font-size:12px}.title strong{display:block;font-size:14px;margin-bottom:3px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-all}.empty{padding:42px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.split .surface{margin-top:0}.row{padding:14px 22px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:14px}.row:last-child{border:0}.row p{margin-top:3px}.pager{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;margin:0;max-height:480px;overflow:auto;background:#f8fafd;padding:20px}dialog{width:560px;max-width:calc(100vw - 32px);max-height:85vh;padding:0;border:1px solid var(--line);border-radius:12px;color:var(--ink);box-shadow:0 20px 90px #122a4b30}dialog::backdrop{background:#23334a66}dialog header{padding:22px;border-bottom:1px solid var(--line)}dialog .body{padding:22px;overflow:auto}dialog footer{padding:18px 22px;background:#f8fafd;display:flex;justify-content:flex-end;gap:10px}dialog label{display:block;margin-top:18px}dialog .body p{margin-bottom:14px}#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:white;max-width:480px;padding:16px 22px;border-radius:8px;z-index:4;box-shadow:0 6px 24px #0002}#login{max-width:440px;margin:12vh auto;padding:36px;background:white;border:1px solid var(--line);border-radius:12px}#login h1{margin-bottom:14px}#login input{width:100%;margin:12px 0}#login button{width:100%}#login-error{color:var(--red);margin-top:12px}[hidden]{display:none!important}.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}a{color:var(--blue)}@media(max-width:1000px){main{padding:26px 22px}.app{grid-template-columns:180px 1fr}.sidebar{padding:24px 10px}.split{grid-template-columns:1fr}.service{align-items:flex-start;flex-direction:column}}@media(max-width:700px){.app{display:block}.sidebar{position:static;height:auto;padding:14px}.brand small,.sidefoot{display:none}.sidebar nav{display:flex;overflow:auto;margin-top:12px;gap:4px}.nav{padding:8px 12px;white-space:nowrap}main{padding:22px 16px}.top{align-items:flex-start}h1{font-size:23px}.metrics{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column}.surface header,.pad{padding:16px}.connection{max-width:145px}.row{padding:14px 16px}#toast{left:16px;right:16px;bottom:16px}}

.badge{white-space:nowrap}
@media(max-width:650px){.instruction-queue table,.instruction-queue tbody,.instruction-queue tr,.instruction-queue td{display:block;width:auto;min-width:0}.instruction-queue thead{display:none}.instruction-queue tr{display:grid;grid-template-columns:1fr auto;padding:12px 16px;border-bottom:1px solid var(--line)}.instruction-queue td{padding:4px 0;border:0}.instruction-queue td:nth-child(n+3){grid-column:1/-1}.instruction-queue td:last-child{display:flex;gap:8px;flex-wrap:wrap}.instruction-queue td.title{max-width:none}dialog .body{max-height:65vh;overflow:auto}}
</style></head><body>
<form id="login" hidden><h1>LarkNotify</h1><p class="muted">管理机器人、任务和消息投递。请输入此实例的访问密钥。</p><label for="token-input">访问密钥</label><input id="token-input" type="password" autocomplete="current-password" required><button class="primary" type="submit">进入管理后台</button><p id="login-error" role="alert"></p></form>
<div class="app" id="app" hidden><aside class="sidebar"><div class="brand">LarkNotify<small>飞书任务管理后台</small></div><nav aria-label="主要导航" id="nav"></nav><div class="sidefoot"><span id="instance">等待实例信息</span><button id="logout">退出登录</button></div></aside><main><div class="top"><div><h1 id="heading">总览</h1><p id="subtitle" class="muted">服务运行与需要处理的事项</p></div><div class="connection"><strong id="connection">正在连接…</strong><span id="updated">等待首次数据</span><br><button id="refresh" style="margin-top:8px">刷新状态</button></div></div><div id="warning" role="status"></div><div id="content"><div class="empty">正在读取状态。如长时间无响应，将显示连接错误。</div></div></main></div>
<dialog id="confirm"><header><h2 id="confirm-title"></h2></header><div class="body"><p id="confirm-target" class="muted"></p><p id="confirm-text"></p><div id="instruction-fields" hidden><label for="instruction-text">指令正文</label><textarea id="instruction-text" maxlength="4000" rows="9" style="width:100%;box-sizing:border-box;padding:12px;font:inherit;resize:vertical"></textarea><p id="instruction-meta" class="muted small"></p><details id="instruction-history"><summary>修改记录</summary><div id="instruction-history-body"></div></details></div><label><input type="checkbox" id="ack"> 我已了解影响，确认执行</label><p id="confirm-error" role="alert" style="color:var(--red)"></p></div><footer><button id="dismiss">返回</button><button class="primary" id="execute" disabled>确认执行</button></footer></dialog>
<dialog id="detail"><header><h2 id="detail-title">详情</h2></header><div class="body" id="detail-body"></div><footer><button id="close-detail">关闭</button></footer></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections={overview:['总览','服务运行与需要处理的事项'],jobs:['会话与工作群','每个会话显示一次；群内后续指令继续同一上下文，历次执行在详情中查看'],queues:['执行队列','暂停后续执行、恢复等待项或清理排队指令'],outbox:['消息投递','核查投递失败，重试或关闭已处理的记录'],diagnostics:['运行诊断','连接、项目、附件与最近日志'],operations:['操作记录','查看受理、执行与结果；不确定的结果需要核查']};
const labels={withdrawn:'已撤回',stopping:'正在停止',accepted:'已受理，等待停止',done:'已处理',idle:'等待下一步',paused:'队列暂停',archived:'已归档',unbound:'未绑定工作群',running:'执行中',cancelling:'取消中',connected:'已连接',completed:'已完成',failed:'失败',interrupted:'已中断',cancelled:'已取消',queued:'等待中',active:'执行中',pending:'待投递',resolved:'已关闭',sent:'已送达',delivered:'已送达',succeeded:'操作成功',unknown:'结果待核查'};
const actionNames={'service.start':'启动机器人','service.stop':'停止机器人','service.restart':'重启机器人','queue.pause':'暂停队列','queue.resume':'恢复队列','queue.clear':'清空等待项','queue.drop':'丢弃等待项','instruction.inspect':'查看记录','instruction.withdraw':'撤回指令','instruction.edit':'重新编辑','job.cancel':'取消当前执行','job.reopen':'恢复任务群','outbox.retry':'重试投递','outbox.delivered':'标记已送达','outbox.obsolete':'关闭过期消息'};
const effects={'instruction.withdraw':'排队指令撤回后不会执行。正在执行的指令需要等待停止确认，并暂停后续队列；已发生的修改和外部操作会保留。','instruction.edit':'排队指令保留位置和附件。正在执行的指令先停止，保存修改稿后保持队列暂停；核查已有修改，再恢复队列执行。','service.start':'启动飞书机器人。后台会等待控制接口连通，再确认启动结果。','service.stop':'停止机器人后，飞书消息将暂时无法处理。管理后台保持运行。有执行中、排队中或待投递工作时会拒绝停机。','service.restart':'机器人会短暂离线。仅在没有执行中、排队中或待投递工作时重启，后台保持运行。','queue.pause':'暂停此会话后续指令。正在执行的任务继续，等待项保留。','queue.resume':'恢复等待中的指令。请先核查上次执行的副作用。失败或中断的旧指令不会自动重放，需要在飞书明确发送后续要求。','queue.clear':'撤回此会话全部等待项，保留已撤回记录。正在执行的任务不受影响。','queue.drop':'撤回这一条等待指令，保留已撤回记录。','job.cancel':'请求取消任务并暂停该群队列。已经写入的文件或其他副作用不会撤销；任务可能需要片刻才结束。','job.reopen':'复用现役群，或重新创建任务群并关联原任务。群就绪后请在飞书发送后续需求。不会自动重跑旧指令。','outbox.retry':'请先在飞书核对这条消息确实未送达。重新投递可能产生重复消息，受理后需查看最终投递状态。','outbox.delivered':'仅在飞书已确认收到消息时使用。关闭失败记录，不会再次发送。','outbox.obsolete':'确认这条消息已经不需要发送。关闭失败记录，不会再次发送。'};
let token='',state=null,tab='overview',query='',filter='all',page=1,pending=null,fetching=false,connectionOK=false,timer=null,seenOps=new Map(),firstState=true;
try{token=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('lct-token')||'';if(token)sessionStorage.setItem('lct-token',token);}catch{}
if(location.search.includes('token='))history.replaceState(null,'',location.pathname+location.hash);
function date(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—';}
function badge(s){return '<span class="badge '+(['failed','interrupted','unknown'].includes(s)?'bad':['running','active','pending','cancelling','queued'].includes(s)?'warn':['connected','completed','succeeded','sent','delivered'].includes(s)?'good':'')+'">'+esc(labels[s]||s||'未知')+'</span>';}
function empty(title,text){return '<div class="empty"><strong>'+esc(title)+'</strong>'+esc(text)+'</div>';}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,9000);}
function canAct(){return state?.managed&&state.online&&connectionOK&&!state.operations?.some(o=>o.status==='running');}
function action(name,target='',label,seq){const service=name.startsWith('service.');const enabled=service?state?.managed&&connectionOK&&!state.operations?.some(o=>o.status==='running')&&state.runtime?.running!==null:canAct();return '<button '+(!enabled?'disabled ':'')+'data-action="'+name+'" data-target="'+esc(target)+'"'+(seq?' data-seq="'+seq+'"':'')+(name.endsWith('cancel')||name.endsWith('clear')||name.endsWith('stop')?' class="danger"':'')+'>'+esc(label||actionNames[name])+'</button>';}
function groupName(chat){return state.groups?.find(g=>g.chat===chat)?.title||chat||'未绑定群';}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
function searchable(list){return list.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));}
function toolbar(options){return '<div class="toolbar"><div class="filters"><input id="search" type="search" aria-label="搜索记录" placeholder="搜索名称、项目或 ID" value="'+esc(query)+'">'+(options?'<select id="filter" aria-label="筛选状态">'+options.map(([v,n])=>'<option value="'+v+'" '+(v===filter?'selected':'')+'>'+n+'</option>').join('')+'</select>':'')+'</div><span class="muted small">'+(state.stale?'历史数据，只读':'操作前会核查最新状态')+'</span></div>';}
function pagination(list,row,headers){const total=Math.max(1,Math.ceil(list.length/20));page=Math.min(page,total);return '<section class="surface">'+(list.length?table(headers,list.slice((page-1)*20,page*20).map(row)):empty('暂无匹配记录','调整筛选条件，或在飞书开始任务。'))+'<div class="pager"><span>共 '+list.length+' 条， 第 '+page+' / '+total+' 页</span><div class="actions"><button data-page="-1" '+(page===1?'disabled':'')+'>上一页</button><button data-page="1" '+(page===total?'disabled':'')+'>下一页</button></div></div></section>';}
function overview(){const rt=state.runtime||{running:true},counts=state.counts||{},running=rt.running===null?'状态未知':rt.running?'运行中':'已停止';let h='<section class="surface"><div class="pad"><div class="service"><div><span class="badge '+(state.online?'good':'warn')+'">'+esc(running)+'</span><h2>'+esc(state.brand||'飞书机器人')+'</h2><p class="muted">'+esc(state.node?.label||'当前设备')+' / '+esc(state.platform||rt.platform||'')+' / '+esc(state.version?'v'+state.version:'版本未标记')+'</p></div><div class="actions">'+(rt.running?action('service.restart')+action('service.stop'):action('service.start'))+'</div></div><div class="metrics">'+[[counts.running||0,'会话执行中'],[counts.queued||0,'等待指令'],[counts.pausedQueues||0,'暂停队列'],[counts.outboxFailed||0,'投递失败']].map(([v,n])=>'<div><strong>'+v+'</strong><span class="muted">'+n+'</span></div>').join('')+'</div></div></section>';
 const issues=[];for(const [chat,q] of Object.entries(state.queues||{}))if(q.paused)issues.push('<div class="row"><div><h3>'+esc(groupName(chat))+'</h3><p class="muted">队列暂停：'+esc(q.pauseReason||'人工暂停')+'</p></div>'+action('queue.resume',chat)+'</div>');for(const o of state.outbox||[])if(o.state==='failed')issues.push('<div class="row"><div><h3>消息投递失败</h3><p class="muted">'+esc(groupName(o.chat))+'：'+esc(o.lastError||'无错误详情')+'</p></div><button data-nav="outbox">处理消息</button></div>');for(const j of state.sessions||[])if(['interrupted','failed','unknown'].includes(j.status))issues.push('<div class="row"><div><h3>'+esc(j.title||j.alias)+'</h3><p class="muted">最近执行需要核查，请查看会话详情后续接</p></div><button data-nav="jobs">查看任务</button></div>');
 h+='<section class="surface"><header><h2>需要处理</h2><span class="muted">'+issues.length+' 项</span></header>'+(issues.join('')||empty('没有待处理的异常','任务和消息出现异常时，会在这里显示处理入口。'))+'</section>';
 h+='<div class="split"><section class="surface"><header><h2>飞书连接</h2></header>'+['im','card'].map(k=>'<div class="row"><span>'+(k==='im'?'消息接收':'权限卡片回调')+'</span>'+badge(!state.stale&&state.health?.[k]?.ready?'connected':'unknown')+'</div>').join('')+'<div class="row"><span>等待审批</span><span>'+(state.approvals?.length||0)+' 项，请在飞书处理</span></div></section><section class="surface"><header><h2>使用说明</h2></header><div class="pad"><p>暂停队列会保留等待项，当前任务继续执行。</p><p class="muted" style="margin-top:10px">恢复任务群后，到飞书发送下一步要求。服务重启不会替你重跑结果未知的指令。</p></div></section></div>';return h;}
function jobs(){
 const list=searchable(state.sessions||[]).filter(j=>filter==='all'||j.status===filter);
 return toolbar([['all','全部会话'],['idle','等待下一步'],['running','执行中'],['queued','排队中'],['paused','队列暂停'],['failed','最近执行失败'],['interrupted','最近执行中断'],['archived','已归档'],['unbound','未绑定群']])+pagination(list,j=>'<tr data-session-id="'+esc(j.id)+'"><td class="title"><strong>'+esc(j.title||j.alias)+'</strong><span class="muted">'+esc(j.alias==='scratch'?'通用任务':j.alias)+'</span><br><span class="mono">'+esc(j.id)+'</span><p class="muted small">'+j.executionCount+' 轮执行</p></td><td>'+badge(j.status)+'</td><td class="title">'+esc(j.groupTitle||(j.status==='archived'?'已归档，原群已结束':'未绑定工作群'))+'</td><td>'+date(j.updated)+'</td><td class="actions-cell"><button data-detail="session" data-id="'+esc(j.id)+'">会话详情</button>'+(j.activeJobId?action('instruction.withdraw',j.activeJobId)+action('instruction.edit',j.activeJobId):j.canReopen?action('job.reopen',j.latestJobId):'<span class="muted small">在现有群继续</span>')+'</td></tr>',['会话 / 工作区','会话状态','工作群','最近活动','操作']);
}
function workspacePanel(j){
 if(!state.workspaceEnabled)return '';
 const chain=j.records.find(r=>r.id===j.latestJobId)?.chain;
 const w=state.workspaces?.[chain];
 const rows=[['主文档',w?.documentId||'未绑定'],['最后同步',date(w?.lastSyncedAt)],['用户访问',w?.userAccess||'尚未验证'],['未同步项',(w?.pendingSync||[]).join(' / ')||'尚未同步'],['同步错误',w?.syncError?.message||'无']];
 const capabilities=Object.entries(w?.capabilities||{}).map(([k,v])=>k+': '+v.status+' / read='+v.read+' / write='+v.write+(v.missingScopes?.length?' / '+v.missingScopes.join(', '):''));
 return '<h3>群工作台</h3>'+table(['资源','状态'],rows.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>'))+'<p class="muted">'+esc(capabilities.join('；'))+'</p>'+(j.chat?'<div class="actions">'+action('workspace.probe',j.latestJobId)+action('workspace.create',j.latestJobId)+action('workspace.sync',j.latestJobId)+'</div>':'<p>恢复群后沿用同一主文档。</p>')+'<p class="muted">读取成功、写入成功和用户能打开分别核验。结果未知时在群内使用 /workspace reconcile [documentId] 核查。</p>';
}
function showSessionDetail(id){
 const j=state.sessions?.find(x=>x.id===id);if(!j)return;
 $('detail-title').textContent=j.title||j.alias;
 $('detail-body').innerHTML=table(['字段','内容'],[['Session ID',j.threadId||'尚未建立'],['工作区',j.alias==='scratch'?'通用任务':j.alias],['工作目录',j.cwd||'尚未建立'],['目录使用方式',j.workspaceMode||'未记录'],['会话状态',labels[j.status]||j.status],['工作群',j.groupTitle||'未绑定工作群'],['执行轮数',j.executionCount],['会话创建时间',date(j.started)]].map(([k,v])=>'<tr><td>'+k+'</td><td class="mono">'+esc(v)+'</td></tr>'))+'<p class="muted" style="margin:16px 0">每条历史记录代表一轮执行。“已完成”仅表示这一轮结束；在现有群发消息会继续本会话。</p>'+(j.workspaceMode==='共享项目目录'?'<div class="banner">本会话沿用共享项目目录。上下文按 Session 独立，文件目录仍与其他历史会话共享；续接会保留原路径。</div>':'')+'<h3>执行历史（'+j.executionCount+' 轮）</h3>'+table(['执行 ID','本轮状态','开始时间','结束时间'],j.records.map(r=>'<tr><td class="mono">'+esc(r.id)+'</td><td>'+badge(r.status)+'</td><td>'+date(r.started)+'</td><td>'+date(r.finished)+'</td></tr>'));
 $('detail-body').innerHTML=workspacePanel(j)+$('detail-body').innerHTML;
 const q=state.queues?.[j.chat];
 $('detail-body').innerHTML+='<h3>当前指令</h3>'+(j.activeJobId?'<div class="actions">'+action('instruction.withdraw',j.activeJobId)+action('instruction.edit',j.activeJobId)+'</div>':'')+(q?.items?.length?table(['序号','状态','操作'],q.items.map(i=>'<tr><td>#'+i.seq+'</td><td>'+badge(i.status)+'</td><td>'+(['queued','active'].includes(i.status)?action('instruction.withdraw',j.chat,null,i.seq)+action('instruction.edit',j.chat,null,i.seq):action('instruction.inspect',j.chat,null,i.seq))+'</td></tr>')):'<p class="muted">没有排队指令</p>')+(q?.paused?'<p>队列已暂停。核查已有修改后，可继续等待中的指令。</p>'+action('queue.resume',j.chat):'');
 $('detail').showModal();
}
function queues(){
 const dispatches=(state.dispatches||[]).filter(d=>d.status==='pending');
 return chatQueues()+(dispatches.length?'<section class="surface"><header><h2>等待建群的指令</h2></header>'+table(['会话 / 请求','状态','操作'],dispatches.map(d=>'<tr><td class="mono">'+esc(groupName(d.chat))+'<br>'+esc(d.target)+'</td><td>'+esc(d.editable?'等待执行名额':'正在准备工作群')+'</td><td>'+(d.editable?action('instruction.withdraw',d.target)+action('instruction.edit',d.target):'任务出现后可在会话列表撤回')+'</td></tr>'))+'</section>':'');
}
function chatQueues(){const list=searchable(Object.entries(state.queues||{}).map(([chat,q])=>({chat,title:groupName(chat),...q})));if(!list.length)return toolbar()+empty('暂无队列','机器人受理飞书指令后会在此出现。');return toolbar()+list.map(q=>'<section class="surface"><header><div><h2>'+esc(q.title)+'</h2><p class="muted small">'+esc(q.paused?'暂停：'+(q.pauseReason||'人工暂停'):'正常接收与执行')+'</p></div><div class="actions">'+action(q.paused?'queue.resume':'queue.pause',q.chat)+action('queue.clear',q.chat)+'</div></header>'+(q.items?.length?'<div class="instruction-queue">'+table(['序号 / 类型','状态','内容','错误 / 时间','操作'],q.items.map(i=>'<tr><td>#'+i.seq+' / '+esc(i.kind)+'</td><td>'+badge(i.status)+'</td><td>'+i.textLen+' 字符（正文隐藏）</td><td class="title">'+esc(i.error||'')+'<p class="muted small">'+date(i.enqueuedAt)+'</p></td><td>'+ (['queued','active'].includes(i.status)?action('instruction.withdraw',q.chat,null,i.seq)+action('instruction.edit',q.chat,null,i.seq):i.status==='stopping'?'<span class="muted">等待停止确认</span>'+(i.stopError?'<p>'+esc(i.stopError)+'</p>'+(i.runJobId?action('job.cancel',i.runJobId,'重试停止'):''):''):action('instruction.inspect',q.chat,null,i.seq))+'</td></tr>'))+'</div>':empty('此队列没有指令','在对应飞书会话发送任务即可入队。'))+'</section>').join('')||(toolbar()+empty('暂无队列','机器人受理飞书指令后会在此出现。'));}
function outbox(){let list=searchable(state.outbox||[]).filter(o=>filter==='all'||o.state===filter);return '<div class="banner info">重试前先到飞书核对是否送达，避免重复投递。正文不在后台展示。</div>'+toolbar([['all','全部记录'],['failed','投递失败'],['pending','待投递'],['resolved','已关闭']])+pagination(list,o=>'<tr><td class="title"><strong>'+esc(groupName(o.chat))+'</strong><span class="mono">'+esc(o.id)+'</span><p class="muted">'+o.textLen+' 字符</p></td><td>'+badge(o.state)+'</td><td>'+o.attempts+'</td><td class="title">'+esc(o.lastError||'—')+'<p class="muted small">'+date(o.createdAt)+'</p></td><td class="actions-cell">'+(o.state==='failed'?action('outbox.retry',o.id)+action('outbox.delivered',o.id)+action('outbox.obsolete',o.id):'—')+'</td></tr>',['目标 / 消息','状态','尝试次数','错误 / 时间','处理']);}
function diagnostics(){const rt=state.runtime||{};let h='<section class="surface"><header><h2>实例与运行环境</h2></header>'+table(['项目','当前值'],[['设备名称',state.node?.label],['内部服务名',state.service||rt.service],['服务管理方式',rt.manager||'内嵌'],['管理后台',state.managed?'独立进程':'内嵌只读'],['执行节点',state.node?state.node.label+' ('+state.node.id+')':'尚未连接'],['Windows 运行方式',state.node?.wsl?'WSL2':'不适用'],['进程 ID',rt.pid],['平台',state.platform||rt.platform],['配置目录',rt.configDir],['状态目录',rt.stateDir],['日志文件',rt.logFile],['数据采集时间',date(state.ts)],['可用项目',(state.projects||[]).join('、')||'暂无']].map(([k,v])=>'<tr><td>'+k+'</td><td class="mono">'+esc(v||'—')+'</td></tr>'))+'</section>';
 h+='<section class="surface"><header><h2>最近事件</h2></header>'+((state.events||[]).length?table(['时间','会话','结果'],state.events.slice(-30).reverse().map(e=>'<tr><td>'+date(e.ts)+'</td><td>'+esc(e.chatType)+'</td><td>'+esc(e.ok?'处理完成':e.error||'失败')+'</td></tr>')):empty('暂无事件','收到飞书消息后会出现处理记录。'))+'</section>';
 h+='<section class="surface"><header><h2>机器人最近日志</h2><span class="muted small">脱敏显示，离线时保留上次快照</span></header><pre>'+esc(state.logs||'暂无日志。服务无法启动时，请查看主机服务管理器日志。')+'</pre></section>';
 h+='<section class="surface"><header><h2>服务启动日志</h2><span class="muted small">由主机服务管理器读取，包含启动失败信息</span></header><pre>'+esc(state.serviceLogs||'暂无服务日志')+'</pre></section>';
 h+='<section class="surface"><header><h2>附件</h2></header>'+((state.attachments||[]).length?table(['类型','大小','状态','接收时间'],state.attachments.map(a=>'<tr><td>'+ (a.isImage?'图片':'文件')+'</td><td>'+a.size+' B</td><td>'+esc(a.kept?'长期保留':a.ready?'已接收':'接收中')+'</td><td>'+date(a.createdAt)+'</td></tr>')):empty('暂无附件','通过飞书发送的图片和文件会在这里显示接收状态。'))+'</section>';return h;}
function operations(){const list=searchable(state.operations||[]);return toolbar()+pagination(list,o=>'<tr><td>'+date(o.createdAt)+'</td><td>'+esc(actionNames[o.action]||o.action)+'<p class="mono muted">'+esc(o.target||'机器人服务')+'</p></td><td>'+badge(o.status)+'</td><td class="title">'+esc(o.message)+'</td></tr>',['发起时间','操作 / 目标','结果','说明']);}
function render(){if(!state)return;$('instance').textContent=state.node?.label||'当前设备';$('heading').textContent=sections[tab][0];$('subtitle').textContent=sections[tab][1];$('nav').innerHTML=Object.entries(sections).map(([k,v])=>'<button class="nav '+(tab===k?'active':'')+'" data-nav="'+k+'" '+(tab===k?'aria-current="page"':'')+'>'+v[0]+'</button>').join('');
 let warnings='';if(!state.managed)warnings+='<div class="banner">当前连接内嵌只读面板。服务启停需要部署独立管理后台后使用。</div>';if(state.stale)warnings+='<div class="banner">'+esc(state.runtime?.running===false?'机器人已停止。下方是上次快照，可以在总览启动。':state.error||'数据不是实时状态，操作已禁用。')+' 数据截止：'+date(state.ts)+'</div>';if(!connectionOK)warnings+='<div class="banner error">与管理后台连接中断，正在重试。显示的是上次数据，操作已禁用。</div>';$('warning').innerHTML=warnings;
 const focus=document.activeElement?.id,selection=focus==='search'?$('search').selectionStart:null;
 $('content').innerHTML=({overview,jobs,queues,outbox,diagnostics,operations})[tab]();if(focus==='search'&&$('search')){$('search').focus();$('search').setSelectionRange(selection,selection);}}
async function api(route,opts={}){const ac=new AbortController(),id=setTimeout(()=>ac.abort(),10000);try{const r=await fetch(route,{...opts,cache:'no-store',headers:{Authorization:'Bearer '+token,...opts.headers},signal:ac.signal});let data;try{data=await r.json();}catch{throw Error('后台返回了无效数据，请检查反向代理配置');}if(r.status===401){showLogin('访问密钥无效或已变更');throw Error('需要重新登录');}if(!r.ok)throw Error(data.error||'请求失败 '+r.status);return data;}finally{clearTimeout(id);}}
function showLogin(error=''){state=null;seenOps.clear();firstState=true;$('app').hidden=true;$('login').hidden=false;$('login-error').textContent=error;token='';try{sessionStorage.removeItem('lct-token');}catch{}}
async function refresh(){if(fetching||!token)return;fetching=true;try{const d=await api('/api/state');state={...d,online:d.managed?d.online:true};connectionOK=true;$('connection').textContent=d.stale?'历史快照':'已连接';$('connection').style.color=d.stale?'var(--amber)':'var(--green)';$('updated').textContent='更新于 '+date(d.observedAt||d.ts);for(const o of d.operations||[]){if(!firstState&&seenOps.get(o.id)==='running'&&o.status!=='running')toast(o.message);seenOps.set(o.id,o.status);}firstState=false;render();}catch(e){connectionOK=false;$('connection').textContent='连接失败';$('connection').style.color='var(--red)';if(state)render();else $('content').innerHTML='<div class="banner error">'+esc(e.name==='AbortError'?'请求超时，将自动重试。请检查管理服务与网络。':e.message)+'</div>';}finally{fetching=false;}}
function navigate(k){if(!sections[k])return;tab=k;query='';filter='all';page=1;render();}
Object.assign(actionNames,{'workspace.probe':'探测工作台','workspace.create':'绑定主文档','workspace.sync':'同步工作台'});
Object.assign(effects,{'workspace.probe':'以现有机器人身份读取主文档和公告能力，不进行飞书写入。','workspace.create':'为当前 Session 创建一份主文档，已有绑定时复用。用户访问权限需要另行核验。','workspace.sync':'更新主文档与当前群公告中的机器人区块。人工修改冲突时保留原文并报告待处理项。'});
async function openAction(b){const name=b.dataset.action;if(name.startsWith('instruction.')&&$('detail').open)$('detail').close();$('instruction-fields').hidden=true;$('instruction-text').value='';$('execute').hidden=name==='instruction.inspect';$('ack').parentElement.hidden=name==='instruction.inspect';$('instruction-history-body').textContent='';pending={action:name,target:b.dataset.target,seq:b.dataset.seq?Number(b.dataset.seq):undefined,expected:name.startsWith('service.')?state.serviceRevision:state.controlRevision,requestId:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),confirmed:true};$('confirm-title').textContent=actionNames[name];$('confirm-target').textContent=name.startsWith('service.')?((state.node?.label||'当前设备')+' 上的机器人'):groupName(pending.target);$('confirm-text').textContent=effects[name];$('ack').checked=false;$('execute').disabled=true;$('execute').textContent='确认执行';$('confirm-error').textContent='';$('confirm').showModal();
 if(name.startsWith('instruction.')){
  $('ack').disabled=true;$('confirm-text').textContent='正在读取指令…';const selected=pending;
  try{
   const d=await api('/api/instruction?target='+encodeURIComponent(pending.target)+(pending.seq?'&seq='+pending.seq:''));
   if(pending!==selected)return;
   if(!d.editable&&name!=='instruction.inspect')throw Error('指令已结束或正在停止，请关闭窗口并刷新');
   pending.itemRevision=d.itemRevision;pending.expected=d.expected;
   $('confirm-target').textContent=groupName(d.chat)+(pending.seq?' · #'+pending.seq:'');
   $('confirm-text').textContent=d.status==='queued'?(name==='instruction.edit'?'保存修改后，指令保留原排队位置和附件。':'撤回后本条不会执行，保留撤回记录。'):effects[name];
   if(name==='instruction.inspect')$('confirm-text').textContent=d.draft?'停止结果待核查，以下为保留的修改稿。核查执行记录后可复制并发送新的指令。':'查看已处理指令与修改历史。';
   $('instruction-fields').hidden=false;$('instruction-text').value=d.draft||d.text;$('instruction-text').readOnly=name!=='instruction.edit';
   $('instruction-meta').textContent='附件 '+d.attachmentCount+' 个 · 历史修改 '+d.historyCount+' 次 · 最多 4000 字符';
   $('instruction-history').hidden=!d.history?.length;$('instruction-history-body').innerHTML=(d.history||[]).map(h=>'<p class="muted small">'+esc(date(h.at))+' · '+esc(h.action)+'</p><pre style="white-space:pre-wrap">'+esc(h.text)+'</pre>').join('');
   $('ack').disabled=false;if(name==='instruction.edit')$('instruction-text').focus();
  }catch(e){if(pending===selected){$('confirm-error').textContent=e.message;$('confirm-text').textContent='无法读取当前指令，未执行任何操作。';}}
 }else $('ack').disabled=false;
}
$('ack').onchange=()=>{$('execute').disabled=!$('ack').checked;};$('dismiss').onclick=()=>{$('confirm').close();pending=null;};$('execute').onclick=async()=>{if(!pending||pending.action==='instruction.inspect'||!$('ack').checked)return;if(pending.action==='instruction.edit'&&pending.text===undefined){const text=$('instruction-text').value.trim();if(!text){$('confirm-error').textContent='请输入修改后的指令';return;}pending.text=text;$('instruction-text').readOnly=true;}$('execute').disabled=true;$('execute').textContent='正在提交…';try{const op=await api('/api/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});seenOps.set(op.id,op.status);$('confirm').close();toast(op.status==='running'?'操作已受理，执行结果将显示在操作记录中。':op.message);pending=null;await refresh();}catch(e){$('confirm-error').textContent=e.name==='AbortError'?'请求超时。结果可能已受理，请先查看操作记录；重试会使用同一请求编号。':e.message;$('execute').disabled=false;$('execute').textContent='重试提交';}};
$('confirm').addEventListener('close',()=>{pending=null;$('instruction-text').value='';$('instruction-fields').hidden=true;});
$('close-detail').onclick=()=>$('detail').close();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav)navigate(b.dataset.nav);if(b.dataset.action)openAction(b);if(b.dataset.page){page+=Number(b.dataset.page);render();}if(b.dataset.detail==='session')showSessionDetail(b.dataset.id);});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;page=1;render();}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;page=1;render();}});
$('login').onsubmit=e=>{e.preventDefault();token=$('token-input').value.trim();if(!token)return;try{sessionStorage.setItem('lct-token',token);}catch{}$('token-input').value='';$('login').hidden=true;$('app').hidden=false;refresh();};$('logout').onclick=()=>{state=null;showLogin();};$('refresh').onclick=()=>refresh();if(token){$('app').hidden=false;refresh();}else showLogin();setInterval(refresh,3000);
</script></body></html>
